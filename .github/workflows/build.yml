name: Build Wheels
on:
  push:
    branches:
      - main
  pull_request:
    - branches:
      - main
    - pull_request:
      - workflow_dispatch:
      - schedule:
          - cron: "0 0 * * *"
permissions: read-all
jobs:
  standard:
    name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - protobuf
          - cffi
        python: &python_3_12_up
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
        build_on:
          - manylinux-armv7l-glibc
          - manylinux-armv7l-musl
          - manylinux-aarch64-glibc
          - manylinux-aarch64-musl
          - manylinux-x86_64-glibc
          - manylinux-x86_64-musl
          - manylinux-s390x-glibc
          - manylinux-ppc64le-glibc
          - manylinux-ppc64le-musl
          - manylinux-riscv64-glibc
          - manylinux-riscv64-musl
    steps:
      - name: Checkout the Git repository
        uses: actions/checkout@v6
      - name: Build ${{ matrix.package }}
        uses: ./build/
        with:
          name: ${{ matrix.package }}
          build_on: ${{ matrix.build_on }}
          python_version: ${{ matrix.python }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
          path: dist
          if-no-files-found: ignore
  
  protobuf:
    name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - protobuf
        python: &python_3_11_up
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        build_on:
          - manylinux-armv7l-glibc
          - manylinux-armv7l-musl
          - manylinux-aarch64-glibc
          - manylinux-aarch64-musl
          - manylinux-x86_64-glibc
          - manylinux-x86_64-musl
          - manylinux-s390x-glibc
          - manylinux-ppc64le-glibc
          - manylinux-ppc64le-musl
          - manylinux-riscv64-glibc
          - manylinux-riscv64-musl
    steps:
      - name: Checkout the Git repository
        uses: actions/checkout@v6
      - name: Build ${{ matrix.package }}
        uses: ./build/
        with:
          name: ${{ matrix.package }}
          build_on: ${{ matrix.build_on }}
          python_version: ${{ matrix.python }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
          path: dist
          if-no-files-found: ignore
  
  cffi:
    name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cffi
        python: *python_3_10_up
        build_on:
          - manylinux-armv7l-musl
          - manylinux-s390x-glibc
          - manylinux-ppc64le-glibc
          - manylinux-ppc64le-musl
          - manylinux-riscv64-glibc
          - manylinux-riscv64-musl
    steps:
      - name: Checkout the Git repository
        uses: actions/checkout@v6
      - name: Build ${{ matrix.package }}
        uses: ./build/
        with:
          name: ${{ matrix.package }}
          build_on: ${{ matrix.build_on }}
          python_version: ${{ matrix.python }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-py${{ matrix.python }}-${{ matrix.build_on }}
          path: dist
          if-no-files-found: ignore